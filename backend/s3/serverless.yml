service: s3
frameworkVersion: '3'

useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  region: us-west-2
  stage: ${opt:stage, 'dev'}

resources:
  Resources:
    S3Bucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        BucketName: ${env:S3_BUCKET_NAME, 'mylg-files-v12'}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - "*"
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
                - HEAD
              AllowedOrigins:
                - "https://beta.mylg.studio"
                - "https://mylg.studio"
                - "http://localhost:3000"
                - "http://localhost:5173"
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        OwnershipControls:
          Rules:
            - ObjectOwnership: ObjectWriter
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    # ---- CloudFront Origin Access Identity ----
    S3OriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: Access identity for ${env:S3_BUCKET_NAME, 'mylg-files-v12'}

    # ---- CloudFront Distribution ----
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          Origins:
            - DomainName: !GetAtt S3Bucket.RegionalDomainName
              Id: S3Origin
              S3OriginConfig:
                OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${S3OriginAccessIdentity}"
          DefaultCacheBehavior:
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: true
              Headers:
                - Origin
                - Access-Control-Request-Method
                - Access-Control-Request-Headers
            Compress: true
            DefaultTTL: 0        # avoid caching missing headers
            MinTTL: 0
            MaxTTL: 0
          ViewerCertificate:
            CloudFrontDefaultCertificate: true # change to ACM cert for custom domain
          HttpVersion: http2
          PriceClass: PriceClass_100

    S3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref S3Bucket
        PolicyDocument:
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                CanonicalUser: !GetAtt S3OriginAccessIdentity.S3CanonicalUserId
              Action: s3:GetObject
              Resource: !Sub "${S3Bucket.Arn}/*"

  Outputs:
    S3BucketName:
      Value: !Ref S3Bucket
      Export:
        Name: s3-bucket-name-${self:provider.stage}
    S3BucketArn:
      Value: !GetAtt S3Bucket.Arn
      Export:
        Name: s3-bucket-arn-${self:provider.stage}
    CloudFrontDomain:
      Value: !GetAtt CloudFrontDistribution.DomainName
      Export:
        Name: cloudfront-domain-${self:provider.stage}
